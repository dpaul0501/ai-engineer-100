site_name: "100 Days: Zero to One AI Engineer"
site_description: A self-paced 100-day program across DSA, ML/DL, AI Engineering, and System Design & Engineering Practice. Learn in depth, build in public, create value.
site_url: https://dpaul0501.github.io/ai-engineer-100/
repo_url: https://github.com/dpaul0501/ai-engineer-100
docs_dir: docs
nav:
  - Home: index.md
  - Orientation slides: orientation.html
  - How each week works: how-it-works.md
  - Choose your paths: paths.md
  - What you build: what-you-build.md
  - Resources: resources.md
  - Sign up: https://forms.gle/RSezwZ7xUM5WRHiE8

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  anchors: warn
  unrecognized_links: warn
